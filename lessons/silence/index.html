<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Silence Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
</head>
<body>
<header class="band">
  <svg class="enso" viewBox="0 0 200 200" aria-hidden="true"><path d="M100 18c-45 0-82 36-82 82s37 82 82 82c46 0 80-34 82-76" fill="none" stroke="#E6C96D" stroke-width="13" stroke-linecap="round"/></svg>
  <div class="wrap" style="position:relative">
    <p class="eyebrow" id="lesson-eyebrow"></p>
    <h1 id="lesson-title"></h1>
    <p class="sub" id="lesson-sub"></p>
    <div class="stats">
      <div class="stat"><b id="st-ans">0/0</b><span>answered</span></div>
      <div class="stat"><b id="st-ok">0</b><span>right first time</span></div>
      <div class="stat"><b id="st-acc">–</b><span>accuracy</span></div>
      <div class="tools">
        <a class="btn sm" href="../../index.html" style="text-decoration:none">← All lessons</a>
        <button class="btn sm" id="btn-export" type="button">Save my answers</button>
        <button class="btn sm" id="btn-theme" type="button">Light / dark</button>
      </div>
    </div>
    <div class="review" id="review"></div>
  </div>
</header>

<nav class="nav" aria-label="Lesson sections">
  <div class="wrap navin">
    <div class="tabs" role="tablist">
      <button id="tab-lesson" role="tab" aria-selected="true" type="button">Lesson · 120 min</button>
      <button id="tab-hw" role="tab" aria-selected="false" type="button">Homework</button>
    </div>
    <div class="steps" id="steps"></div>
  </div>
</nav>

<div class="wrap">
  <section id="export" class="ex" hidden>
    <div class="ex-h"><h3>Your answers</h3></div>
    <p class="instr">Copy this text and send it to your teacher, or download it as a file.</p>
    <textarea id="export-text" rows="10" readonly aria-label="Your answers"></textarea>
    <div class="bar">
      <button class="btn primary" id="btn-copy" type="button">Copy</button>
      <button class="btn" id="btn-dl" type="button">Download .txt</button>
      <button class="btn ghost" id="btn-close" type="button">Close</button>
      <button class="btn ghost" id="btn-clear" type="button">Erase my answers</button>
      <span class="score" id="copy-msg"></span>
    </div>
  </section>
  <main id="main-lesson"></main>
  <main id="main-hw" hidden></main>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="../../shared/engine.js"></script>
</body>
</html>
